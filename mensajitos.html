    <!-- Contenedor interactivo que actúa como botón de "Me gusta" -->
    <div id="btnLike" class="like-container">
        <span class="heart">❤️</span>
        <span id="contador" class="contador">0</span>
        <p>Dale like si aparecio un juego que te gusta</p>
    </div>
      <script>
        // 1. Seleccionamos los elementos
        const botonLike = document.getElementById('btnLike');
        const spanContador = document.getElementById('contador');

        // 2. Inicializamos la variable del contador
        let cantidadLikes = 0;

        // 3. Agregamos el evento de clic al contenedor
        botonLike.addEventListener('click', function() {
            // Incrementamos el valor
            cantidadLikes++;
            
            // Actualizamos el número en la pantalla
            spanContador.textContent = cantidadLikes;
        });
    </script>


     


    <section id="registrar">
